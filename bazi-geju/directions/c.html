<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C · 古籍朱批</title>
<script src="../vendor/gsap.min.js"></script>
<script src="../vendor/om.js"></script>
<link rel="stylesheet" href="../assets/fonts/noto-serif-sc.css">
<style>
@font-face { font-family: "Noto Sans SC"; src: url("../assets/fonts/NotoSansSC-500.woff") format("woff"); font-weight: 500; }
@font-face { font-family: "Noto Sans SC"; src: url("../assets/fonts/NotoSansSC-900.woff") format("woff"); font-weight: 900; }
@font-face { font-family: "LXGW WenKai"; src: url("../assets/fonts/LXGWWenKai-500.woff") format("woff"); font-weight: 500; }
:root { --paper: #e6dbc0; --paper-dk: #d3c4a1; --ink: #27231f; --ink-soft: #27231fb0; --cinnabar: #b0281c; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
#film { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--ink); background: var(--paper);
  font-family: "Noto Serif SC", serif; font-weight: 500; }
svg.tex { position: absolute; inset: 0; }
.hook { position: absolute; top: 214px; left: 0; right: 0; text-align: center; font-family: "Noto Sans SC", sans-serif; font-weight: 900; font-size: 62px; letter-spacing: 4px; }
.hook small { display: block; margin-top: 4px; font-weight: 500; font-size: 28px; letter-spacing: 6px; color: var(--ink-soft); }
.ch { position: absolute; width: 76px; height: 76px; margin-left: -38px; text-align: center; font-size: 70px; line-height: 76px; }
.ju::after { content: ""; position: absolute; right: -16px; bottom: -6px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--cinnabar); }
.note { position: absolute; writing-mode: vertical-rl; font-family: "LXGW WenKai", serif; font-size: 46px; letter-spacing: 6px; color: var(--cinnabar); }
.banxin { position: absolute; left: 150px; top: 380px; width: 56px; height: 1040px; border-left: 2px solid var(--ink-soft); border-right: 2px solid var(--ink-soft); }
.banxin .t { position: absolute; top: 150px; left: 0; width: 56px; writing-mode: vertical-rl; text-align: center; font-size: 34px; letter-spacing: 8px; line-height: 56px; color: var(--ink); }
.fish { position: absolute; left: 0; width: 56px; height: 34px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 55%, 0 100%); }
</style>
</head>
<body>
<div id="film" data-composition-id="c" data-width="1080" data-height="1920">
  <svg class="tex" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs>
      <filter id="fibre" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="3" seed="7" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .42  0 0 0 0 .34  0 0 0 0 .22  0 0 0 .55 -.18"/>
      </filter>
      <filter id="blot" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="3" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .43  0 0 0 0 .25  0 0 0 .9 -.32"/>
      </filter>
      <radialGradient id="vig" cx="50%" cy="46%" r="70%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#3a2a14" stop-opacity=".32"/></radialGradient>
      <filter id="brush"><feTurbulence baseFrequency="0.05" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
    </defs>
    <rect width="1080" height="1920" filter="url(#blot)"/>
    <rect width="1080" height="1920" filter="url(#fibre)" opacity=".5"/>
    <rect width="1080" height="1920" fill="url(#vig)"/>
    <!-- 版框: thick outer, thin inner; 界行 between columns -->
    <rect x="132" y="364" width="866" height="1072" fill="none" stroke="#27231f" stroke-opacity=".78" stroke-width="7"/>
    <rect x="146" y="378" width="838" height="1044" fill="none" stroke="#27231f" stroke-opacity=".6" stroke-width="2"/>
    <g stroke="#27231f" stroke-opacity=".28" stroke-width="2">
      <line x1="840" y1="378" x2="840" y2="1422"/><line x1="720" y1="378" x2="720" y2="1422"/>
      <line x1="600" y1="378" x2="600" y2="1422"/><line x1="480" y1="378" x2="480" y2="1422"/>
      <line x1="360" y1="378" x2="360" y2="1422"/>
    </g>
    <!-- 朱砂 circle around 月令, brushed twice -->
    <g filter="url(#brush)" fill="none" stroke="#b0281c" stroke-linecap="round">
      <path d="M782 890 C840 893 846 1072 778 1077 C714 1080 714 898 790 886" stroke-width="7" opacity=".92"/>
      <path d="M792 898 C834 910 836 1064 774 1070" stroke-width="3" opacity=".7"/>
    </g>
  </svg>

  <div class="hook">格局从哪来？<small>《子平真诠》开篇第一句</small></div>

  <div class="banxin"><div class="fish" style="top:110px"></div><div class="t">子平真詮　卷一</div><div class="fish" style="top:560px;transform:scaleY(-1)"></div></div>

  <div id="text"></div>

  <div class="note" style="left:298px;top:640px">寅藏甲丙戊</div>
  <div class="note" style="left:240px;top:700px">不透甲而透丙</div>
  <div class="note" style="left:298px;top:1136px;font-size:40px;color:#b0281ccc">辛日主</div>
  <div class="note" style="left:240px;top:1080px;font-size:56px;font-weight:500">正官格</div>
</div>
<script>
  // 竖排刻本：columns right to left, each character on a fixed grid; 句读 marks after each clause.
  const cols = [
    { x: 900, text: '　　論用神' },
    { x: 780, text: '八字用神專求月令以日干配' },
    { x: 660, text: '月令地支而生剋不同格局分' },
    { x: 540, text: '焉財官印食此用神之善而順' },
    { x: 420, text: '用之者也' },
  ];
  const ju = new Set(['1:3', '1:7', '2:3', '2:8', '3:0', '3:4', '4:3']);
  const box = document.getElementById('text');
  cols.forEach((c, ci) => [...c.text].forEach((ch, k) => {
    if (ch === '　') return;
    const s = document.createElement('div');
    s.className = 'ch' + (ju.has(ci + ':' + k) ? ' ju' : '');
    s.style.left = c.x + 'px'; s.style.top = (400 + 84 * k) + 'px';
    s.textContent = ch; box.appendChild(s);
  }));
  const tl = gsap.timeline({ paused: true });
  tl.addLabel('scene:key', 0).to({}, { duration: 1 });
  window.__timelines['c'] = tl;
</script>
</body>
</html>
